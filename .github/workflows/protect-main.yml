name: Protect main

# Native GitHub branch protection / rulesets are not enforced on private
# repos under the Free plan (only public repos, or private repos on
# Pro/Team). This workflow is a reactive substitute: it can't reject a
# push at the wire (that needs the paid feature), but it force-reverts
# any push to `main` that didn't come from the repo owner, seconds after
# it lands. Good enough to stop accidental direct pushes and PR merges
# by anyone but the owner; not a substitute for real access control
# against a determined bad actor with write access (they could disable
# or edit this file in the same push).

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  revert-unauthorized:
    # Change this to your GitHub username.
    if: github.actor != 'mamahoos'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Revert unauthorized push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Unauthorized push to main by ${{ github.actor }} — reverting."
          git reset --hard HEAD~1
          git push --force origin main
