services:
  selfbot:
    build:
      context: .
      dockerfile: docker/Dockerfile
      network: host
    container_name: telegram-selfbot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./tmp:/app/tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import app; import app.main"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
