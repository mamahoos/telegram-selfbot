services:
  selfbot:
    build:
      context: .
      dockerfile: docker/Dockerfile
      network: host
    container_name: telegram-selfbot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./tmp:/app/tmp
      - ./volumes/sessions:/app/volumes/sessions
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys; c=open('/proc/1/cmdline','rb').read().decode('latin-1'); sys.exit(0 if 'app.main' in c else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
